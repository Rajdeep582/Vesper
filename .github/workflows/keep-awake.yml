# Backup keep-awake pinger for Render Free (primary: cron-job.org every 10 min).
# GitHub may delay scheduled runs by several minutes; cron-job.org is the precise one.
# Override with repository variable VESPER_HEALTH_URL if the service URL changes.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 "${{ vars.VESPER_HEALTH_URL || 'https://vesper-api-mthr.onrender.com/health' }}" || true
